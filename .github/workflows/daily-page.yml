name: Daily book page

on:
  schedule:
    # 00:10 UTC Tue-Sat is 08:10 SGT. Yahoo's end date is exclusive and the
    # runner's clock is UTC, so the job has to start after midnight UTC to
    # include the US session that closed the previous evening.
    - cron: "10 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Refresh prices and factors
        run: python main.py --market us
      - name: Build the page
        run: python web/build_page.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
